<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#FFF8F0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="حروفي 2">
  <title>حروفي 2 — درس حرف م</title>
  <link rel="manifest" href="./manifest.webmanifest?v=2.0.0-alpha.15">
  <link rel="apple-touch-icon" href="../assets/icons/icon-192.png">
<link rel="stylesheet" href="./fonts.css?v=2.0.0-alpha.15">
  <link rel="stylesheet" href="./styles.css?v=2.0.0-alpha.15">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button id="backBtn" class="icon-button hidden" type="button" aria-label="رجوع">←</button>
      <div class="brand">
        <span class="brand-mark">م</span>
        <div class="brand-copy">
          <strong>حروفي 2</strong>
          <small>الدرس الذهبي · حرف م</small>
          <span id="appVersion" class="app-version">2.0.0-alpha.15</span>
        </div>
      </div>
      <div class="top-actions">
        <button id="settingsBtn" class="icon-button settings-button" type="button" aria-label="إعدادات ولي الأمر">عـ</button>
        <button id="soundBtn" class="icon-button" type="button" aria-label="الصوت">🔊</button>
      </div>
    </header>

    <div class="lesson-progress" aria-label="تقدم الدرس">
      <span id="progressFill"></span>
    </div>

    <main id="screen" class="screen" aria-live="polite"></main>
  </div>

  <div id="settingsPanel" class="settings-panel" hidden>
    <div class="settings-sheet">
      <div class="settings-head">
        <div><strong>إعدادات ولي الأمر</strong><small>لا تظهر داخل أنشطة الطفل</small></div>
        <button id="settingsClose" class="sheet-close" type="button" aria-label="إغلاق">×</button>
      </div>
      <div class="settings-section-title">خط الحروف التعليمية</div>
      <div class="font-options">
        <button type="button" data-font="school"><span class="font-sample sample-school">م ب س ع</span><strong>نسخ مدرسي</strong><small>Noto Naskh</small></button>
        <button type="button" data-font="scheherazade"><span class="font-sample sample-scheherazade">م ب س ع</span><strong>شهرزاد</strong><small>نسخي مشكول</small></button>
        <button type="button" data-font="harmattan"><span class="font-sample sample-harmattan">م ب س ع</span><strong>Harmattan</strong><small>تعليمي بسيط</small></button>
        <button type="button" data-font="sans"><span class="font-sample sample-sans">م ب س ع</span><strong>Noto Sans</strong><small>واضح للشاشة</small></button>
        <button type="button" data-font="kufi"><span class="font-sample sample-kufi">م ب س ع</span><strong>Noto Kufi</strong><small>هندسي منظم</small></button>
        <button type="button" data-font="baloo"><span class="font-sample sample-baloo">م ب س ع</span><strong>Baloo</strong><small>طفولي مستدير</small></button>
        <button type="button" data-font="cairo"><span class="font-sample sample-cairo">م ب س ع</span><strong>Cairo</strong><small>هندسي واضح</small></button>
        <button type="button" data-font="readex"><span class="font-sample sample-readex">م ب س ع</span><strong>Readex</strong><small>قراءة مبسطة</small></button>
        <button type="button" data-font="geeza"><span class="font-sample sample-geeza">م ب س ع</span><strong>Geeza Pro</strong><small>iPhone</small></button>
      </div>
      <div id="fontStatus" class="font-status" aria-live="polite"></div>

      <div class="settings-section-title">الصوت العربي</div>
      <div class="voice-settings">
        <label class="voice-field">
          <span>الصوت المستخدم</span>
          <select id="voiceSelect" aria-label="اختيار الصوت العربي">
            <option value="">اختيار تلقائي</option>
          </select>
        </label>
        <button id="voiceTest" class="voice-test" type="button">🔊 جرّب النطق: مِيمْ — مَوْزٌ — مَ / مَا</button>
        <small class="voice-note">تُنطق الكلمات التعليمية منفردة مع تشكيل كامل وسكون عند الوقف، ثم تُستخدم سرعة أبطأ من التعليمات.</small>
      </div>
    </div>
  </div>

  <div id="updateBar" class="update-bar" hidden>
    <div><strong id="updateTitle">يوجد تحديث جديد</strong><span id="updateStatus">جارٍ تجهيز النسخة…</span></div>
    <div class="update-progress"><span id="updateProgressFill"></span></div>
  </div>

  <div id="celebration" class="celebration" aria-hidden="true"></div>
  <div id="toast" class="toast" hidden></div>

  <script src="./app.js?v=2.0.0-alpha.15" defer></script>
</body>
</html>
