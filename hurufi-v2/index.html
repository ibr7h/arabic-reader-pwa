<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F6F3EC">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="حروفي 2">
  <title>حروفي 2 — درس حرف م</title>
  <link rel="manifest" href="./manifest.webmanifest?v=2.0.0-alpha.1">
  <link rel="apple-touch-icon" href="../assets/icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css?v=2.0.0-alpha.1">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button id="backBtn" class="icon-button hidden" type="button" aria-label="رجوع">←</button>
      <div class="brand">
        <span class="brand-mark">م</span>
        <div class="brand-copy">
          <strong>حروفي 2</strong>
          <small>الدرس الذهبي · حرف م</small>
        </div>
      </div>
      <button id="soundBtn" class="icon-button" type="button" aria-label="الصوت">🔊</button>
    </header>

    <div class="lesson-progress" aria-label="تقدم الدرس">
      <span id="progressFill"></span>
    </div>

    <main id="screen" class="screen" aria-live="polite"></main>
  </div>

  <div id="celebration" class="celebration" aria-hidden="true"></div>
  <div id="toast" class="toast" hidden></div>

  <script src="./app.js?v=2.0.0-alpha.1" defer></script>
</body>
</html>
