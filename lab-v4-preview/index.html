<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>معمل اللغات العربية v4 — معاينة</title><style>body{font-family:system-ui,sans-serif;background:#e2e8f0;display:grid;place-items:center;min-height:100vh;margin:0;color:#334155}.box{background:#fff;padding:24px;border-radius:18px;box-shadow:0 10px 30px #0002;text-align:center;max-width:480px}</style></head><body><div class="box"><strong>جارٍ تحميل النسخة التجريبية v4…</strong><p>هذه نسخة معاينة قيد المراجعة.</p></div><script>(async()=>{try{if(!('DecompressionStream'in window))throw Error('المتصفح لا يدعم فك الضغط المطلوب لهذه المعاينة');const r=await fetch('payload.gz',{cache:'no-store'});if(!r.ok)throw Error('تعذر تحميل ملف المعاينة');const text=await new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(text);document.close()}catch(e){document.body.innerHTML='<div class="box"><strong>تعذر تشغيل نسخة المعاينة</strong><p>'+String(e.message||e)+'</p></div>';console.error(e)}})();</script></body></html>
