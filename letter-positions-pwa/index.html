<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8f5ed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="حروفي">
  <title>حروفي — تعلم الحروف العربية</title>
  <link rel="manifest" href="./manifest.webmanifest?v=1.4.1">
  <link rel="apple-touch-icon" href="../assets/icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css?v=1.4.1">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button id="backBtn" class="icon-btn hidden" type="button" aria-label="رجوع">←</button>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">أ</span>
        <div><strong>حروفي</strong><small>أتعلم · أميّز · أتقن</small><span id="appVersion" class="app-version">v1.4.1</span></div>
      </div>
      <button id="soundBtn" class="icon-btn" type="button" aria-label="تشغيل أو إيقاف الصوت">🔊</button>
    </header>

    <main id="screen" class="screen" aria-live="polite"></main>

    <nav id="bottomNav" class="bottom-nav" aria-label="التنقل الرئيسي">
      <button data-screen="home" class="active"><span>⌂</span><small>الرئيسية</small></button>
      <button data-screen="path"><span>↟</span><small>المسار</small></button>
      <button data-screen="quiz"><span>✓</span><small>اختبار</small></button>
      <button data-screen="progress"><span>★</span><small>تقدمي</small></button>
    </nav>
  </div>
  <div id="updateBar" class="update-bar" hidden><div class="update-copy"><strong id="updateTitle">يوجد تحديث جديد</strong><span id="updateStatus">جارٍ التحديث…</span><div class="update-progress"><span id="updateProgressFill"></span></div></div></div>
  <div id="celebration" class="celebration" aria-hidden="true"></div>
  <script src="./app.js?v=1.4.1" defer></script>
</body>
</html>
