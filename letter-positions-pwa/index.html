<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8f5ed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="حروفي">
  <title>حروفي — تعلم الحروف العربية</title>
  <link rel="manifest" href="./manifest.webmanifest?v=1.7.0">
  <link rel="apple-touch-icon" href="../assets/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;700&family=Cairo:wght@400;600;700&family=Changa:wght@400;600;700&family=Lalezar&family=Marhey:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=1.7.0">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button id="backBtn" class="icon-btn hidden" type="button" aria-label="رجوع">←</button>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">أ</span>
        <div><strong>حروفي</strong><small>أتعلم · أميّز · أتقن</small><span id="appVersion" class="app-version">v1.7.0</span></div>
      </div>
      <div class="header-actions">
        <button id="fontBtn" class="icon-btn font-btn" type="button" aria-label="تغيير خط الحروف">عـ</button>
        <button id="soundBtn" class="icon-btn" type="button" aria-label="تشغيل أو إيقاف الصوت">🔊</button>
      </div>
    </header>

    <main id="screen" class="screen" aria-live="polite"></main>

    <nav id="bottomNav" class="bottom-nav" aria-label="التنقل الرئيسي">
      <button data-screen="home" class="active"><span>⌂</span><small>الرئيسية</small></button>
      <button data-screen="path"><span>↟</span><small>المسار</small></button>
      <button data-screen="quiz"><span>✓</span><small>اختبار</small></button>
      <button data-screen="progress"><span>★</span><small>تقدمي</small></button>
    </nav>
  </div>
  <div id="fontPanel" class="font-panel" hidden>
    <div class="font-panel-head">
      <div><strong>اختر خط الحروف</strong><small>يتغير شكل الحروف التعليمية فقط</small></div>
      <button type="button" class="font-close" aria-label="إغلاق">×</button>
    </div>

    <div class="font-section-title">🌟 خطوط أطفال ومرحة</div>
    <div class="font-options">
      <button type="button" data-font-choice="baloo"><span class="font-preview font-preview-baloo">بـ ـبـ ـب</span><strong>Baloo</strong><small>طفولي ومرح</small></button>
      <button type="button" data-font-choice="marhey"><span class="font-preview font-preview-marhey">بـ ـبـ ـب</span><strong>Marhey</strong><small>مرح للطفولة</small></button>
      <button type="button" data-font-choice="lalezar"><span class="font-preview font-preview-lalezar">بـ ـبـ ـب</span><strong>Lalezar</strong><small>كرتوني بارز</small></button>
      <button type="button" data-font-choice="changa"><span class="font-preview font-preview-changa">بـ ـبـ ـب</span><strong>Changa</strong><small>مكعبات واضحة</small></button>
    </div>

    <div class="font-section-title">📚 خطوط مدرسية وتعليمية</div>
    <div class="font-options">
      <button type="button" data-font-choice="school"><span class="font-preview font-preview-school">بـ ـبـ ـب</span><strong>النسخ المدرسي</strong><small>Noto Naskh Arabic</small></button>
      <button type="button" data-font-choice="cairo"><span class="font-preview font-preview-cairo">بـ ـبـ ـب</span><strong>Cairo</strong><small>هندسي واضح</small></button>
      <button type="button" data-font-choice="readex"><span class="font-preview font-preview-readex">بـ ـبـ ـب</span><strong>Readex</strong><small>قراءة مبسطة</small></button>
      <button type="button" data-font-choice="geeza"><span class="font-preview font-preview-geeza">بـ ـبـ ـب</span><strong>Geeza Pro</strong><small>واضح على iPhone</small></button>
      <button type="button" data-font-choice="sf"><span class="font-preview font-preview-sf">بـ ـبـ ـب</span><strong>SF Arabic</strong><small>حديث</small></button>
      <button type="button" data-font-choice="naskh"><span class="font-preview font-preview-naskh">بـ ـبـ ـب</span><strong>نسخي بديل</strong><small>Traditional / Naskh</small></button>
    </div>
    <div id="fontStatus" class="font-status" aria-live="polite"></div>
  </div>
  <div id="updateBar" class="update-bar" hidden><div class="update-copy"><strong id="updateTitle">يوجد تحديث جديد</strong><span id="updateStatus">جارٍ التحديث…</span><div class="update-progress"><span id="updateProgressFill"></span></div></div></div>
  <div id="celebration" class="celebration" aria-hidden="true"></div>
  <script src="./app.js?v=1.7.0" defer></script>
</body>
</html>
