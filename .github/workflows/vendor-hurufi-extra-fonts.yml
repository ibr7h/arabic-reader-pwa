name: Vendor Hurufi Extra Fonts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vendor-hurufi-extra-fonts.yml"

permissions:
  contents: write

jobs:
  vendor-extra-fonts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download official Google Fonts sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hurufi-v2/assets/fonts/licenses

          curl -fL "https://raw.githubusercontent.com/google/fonts/main/ofl/scheherazadenew/ScheherazadeNew-Regular.ttf"             -o "hurufi-v2/assets/fonts/ScheherazadeNew-Regular.ttf"
          curl -fL "https://raw.githubusercontent.com/google/fonts/main/ofl/harmattan/Harmattan-Regular.ttf"             -o "hurufi-v2/assets/fonts/Harmattan-Regular.ttf"
          curl -fL "https://raw.githubusercontent.com/google/fonts/main/ofl/notosansarabic/NotoSansArabic%5Bwdth%2Cwght%5D.ttf"             -o "hurufi-v2/assets/fonts/NotoSansArabic-VF.ttf"
          curl -fL "https://raw.githubusercontent.com/google/fonts/main/ofl/notokufiarabic/NotoKufiArabic%5Bwght%5D.ttf"             -o "hurufi-v2/assets/fonts/NotoKufiArabic-VF.ttf"

          curl -fL "https://raw.githubusercontent.com/google/fonts/main/ofl/scheherazadenew/OFL.txt"             -o "hurufi-v2/assets/fonts/licenses/ScheherazadeNew-OFL.txt"
          curl -fL "https://raw.githubusercontent.com/google/fonts/main/ofl/harmattan/OFL.txt"             -o "hurufi-v2/assets/fonts/licenses/Harmattan-OFL.txt"
          curl -fL "https://raw.githubusercontent.com/google/fonts/main/ofl/notosansarabic/OFL.txt"             -o "hurufi-v2/assets/fonts/licenses/NotoSansArabic-OFL.txt"
          curl -fL "https://raw.githubusercontent.com/google/fonts/main/ofl/notokufiarabic/OFL.txt"             -o "hurufi-v2/assets/fonts/licenses/NotoKufiArabic-OFL.txt"

          (
            cd hurufi-v2/assets/fonts
            sha256sum ScheherazadeNew-Regular.ttf Harmattan-Regular.ttf NotoSansArabic-VF.ttf NotoKufiArabic-VF.ttf >> SHA256SUMS.txt
          )

      - name: Commit vendored fonts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hurufi-v2/assets/fonts
          if git diff --cached --quiet; then
            echo "Extra fonts already vendored."
            exit 0
          fi
          git commit -m "Vendor extra Hurufi 2 Arabic learning fonts"
          git push
