name: Validate Hurufi Letter Positions PWA
on:
  push:
    branches: [letter-positions-pwa-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check letter-positions-pwa/app.js
      - name: Validate manifest and project files
        run: |
          python - <<'PY'
          import json, pathlib, re
          root = pathlib.Path("letter-positions-pwa")
          required = ["index.html","styles.css","app.js","manifest.webmanifest","sw.js","README.md"]
          for name in required:
              p = root / name
              assert p.exists() and p.stat().st_size > 0, name
          manifest = json.loads((root/"manifest.webmanifest").read_text())
          assert manifest["display"] == "standalone"
          assert manifest["start_url"] == "./"
          js = (root/"app.js").read_text()
          assert js.count('["') >= 28
          for token in ["makeIdentifyQuestion","makePositionQuestion","makeShapeQuestion","serviceWorker","hurufi-progress:v1"]:
              assert token in js, token
          html = (root/"index.html").read_text()
          for asset in ["./styles.css","./app.js","./manifest.webmanifest"]:
              assert asset in html, asset
          print("Static project validation passed.")
          PY
      - name: Smoke-test static serving
        run: |
          python -m http.server 8080 >/tmp/hurufi-http.log 2>&1 &
          pid=$!
          sleep 1
          curl --fail --silent http://127.0.0.1:8080/letter-positions-pwa/ | grep -q "حروفي"
          curl --fail --silent http://127.0.0.1:8080/letter-positions-pwa/app.js | grep -q "makePositionQuestion"
          kill $pid
