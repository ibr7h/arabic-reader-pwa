name: Assemble secure v4 preview
on:
  workflow_dispatch:
  push:
    paths:
      - 'lab-v4-build/**'
      - '.github/workflows/assemble-secure-v4.yml'
permissions:
  contents: write
jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble hardened preview
        shell: bash
        run: |
          set -euo pipefail
          rm -rf lab-v4-preview
          mkdir -p lab-v4-preview
          cat lab-v4-build/bundle/part-*.txt > /tmp/v4.b64
          base64 -d /tmp/v4.b64 > /tmp/v4.tar.gz
          tar -xzf /tmp/v4.tar.gz -C lab-v4-preview
          test -f lab-v4-preview/index.html
          test -f lab-v4-preview/assets/js/app.js
          test -f lab-v4-preview/SECURITY_REVIEW_v4.md
          rm -rf lab-v4-build
      - name: Commit assembled preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A lab-v4-preview lab-v4-build
          git commit -m 'Publish hardened v4 preview' || exit 0
          git push
